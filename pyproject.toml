[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "deepert"
version = "0.1.0"
description = "Differentiable time-lapse ERT in pure JAX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cupy-cuda12x>=14.0.0; sys_platform == 'linux'",
    "ipykernel>=7.2.0",
    "jax[cuda12]>=0.9.2",
    "joblib>=1.5.3",
    "matplotlib>=3.10.0",
    "meshio>=5.3.5",
    "nvidia-cudss-cu12>=0.7.1.6; sys_platform == 'linux'",
    "nvmath-python>=0.8.0; sys_platform == 'linux'",
    "pygimli>=1.6.0",
    "pyhydrogeophysx>=0.1.0",
    "scipy>=1.16.0",
    "torch>=2.10.0",
    "triangle>=20250106",
]

[project.optional-dependencies]
examples = [
    "pftools>=1.3.14",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["deepert"]

[tool.hatch.build.targets.sdist]
include = [
    "/deepert",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]
